# Loupe test settings for the dovecot/dovecot 2.4 image: any user logs in
# with the password "secret" (USER_PASSWORD), cleartext login is allowed on
# the plain port, and the standard special-use mailboxes exist.
auth_allow_cleartext = yes

namespace inbox {
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}
