name: CI

on:
  push:
    branches: [main]
    # The website and social posts have workflows of their own (site.yml,
    # social.yml); changing only them shouldn't build a new Nightly.
    paths-ignore:
      - "site/**"
      - "marketing/**"
      - ".github/workflows/site.yml"
      - ".github/workflows/social.yml"
  pull_request:
    paths-ignore:
      - "site/**"
      - "marketing/**"
      - ".github/workflows/site.yml"
      - ".github/workflows/social.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze
      - run: tool/ci/test.sh

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LOUPE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/loupe-release.jks"
            echo "LOUPE_KEYSTORE_FILE=$RUNNER_TEMP/loupe-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release keystore secret; signing with the debug key."
          fi
      - name: Build APKs
        working-directory: app
        env:
          LOUPE_KEYSTORE_PASSWORD: ${{ secrets.LOUPE_KEYSTORE_PASSWORD }}
          LOUPE_KEY_ALIAS: ${{ secrets.LOUPE_KEY_ALIAS }}
          LOUPE_KEY_PASSWORD: ${{ secrets.LOUPE_KEY_PASSWORD }}
          # OAuth client ids (docs/oauth-setup.md). Empty (no secret, or a pull
          # request from a fork) leaves "Sign in with Google/Microsoft" hidden.
          # Passed through the environment, not spliced into the script.
          LOUPE_GOOGLE_CLIENT_ID: ${{ secrets.LOUPE_GOOGLE_CLIENT_ID }}
          LOUPE_MICROSOFT_CLIENT_ID: ${{ secrets.LOUPE_MICROSOFT_CLIENT_ID }}
        run: |
          echo "Sign in with Google: $([ -n "$LOUPE_GOOGLE_CLIENT_ID" ] && echo on || echo off)"
          echo "Sign in with Microsoft: $([ -n "$LOUPE_MICROSOFT_CLIENT_ID" ] && echo on || echo off)"
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-x64 \
            --build-number=${{ github.run_number }} \
            --build-name=0.1.${{ github.run_number }} \
            --dart-define=LOUPE_GOOGLE_CLIENT_ID="$LOUPE_GOOGLE_CLIENT_ID" \
            --dart-define=LOUPE_MICROSOFT_CLIENT_ID="$LOUPE_MICROSOFT_CLIENT_ID"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../dist/loupe-0.1.${{ github.run_number }}-arm64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk ../dist/loupe-0.1.${{ github.run_number }}-x86_64.apk
      - uses: actions/upload-artifact@v5
        with:
          name: loupe-apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 14
      - name: Publish to the rolling "nightly" pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Build ${{ github.run_number }} from ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
          git tag -f nightly && git push -f origin refs/tags/nightly
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --prerelease --title "Nightly" --notes "$notes"
          gh release edit nightly --prerelease --title "Nightly 0.1.${{ github.run_number }}" --notes "$notes"
          for f in $(gh release view nightly --json assets --jq '.assets[].name'); do gh release delete-asset nightly "$f" --yes; done
          gh release upload nightly dist/*.apk --clobber
