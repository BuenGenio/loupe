name: CI

on:
  push:
    branches: [main]
    # The website and social posts have workflows of their own (site.yml,
    # social.yml); changing only them shouldn't build a new Nightly.
    paths-ignore:
      - "site/**"
      - "marketing/**"
      - ".github/workflows/site.yml"
      - ".github/workflows/social.yml"
      - ".github/workflows/play-listing.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/fdroid-check.yml"
      - "fastlane/**"
  pull_request:
    paths-ignore:
      - "site/**"
      - "marketing/**"
      - ".github/workflows/site.yml"
      - ".github/workflows/social.yml"
      - ".github/workflows/play-listing.yml"
      - "fastlane/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Also the .flutter submodule's version, which releases and F-Droid build
  # with: tool/ci/check_free.sh checks they match (docs/releasing.md).
  FLUTTER_VERSION: "3.47.6"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: The committed tree is the Free release type
        run: tool/ci/check_free.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart analyze
      - run: tool/ci/test.sh

  # Both release types from every change (docs/releasing.md). The Free APKs
  # are checked and kept as an artifact; the NonFree ones are the Nightly.
  # Numbered releases (tags v*) are .github/workflows/release.yml.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # The release's toolchain (docs/releasing.md), so pull requests try it out.
      - name: Android SDK as F-Droid has it
        run: tool/ci/android_sdk.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LOUPE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/loupe-release.jks"
            echo "LOUPE_KEYSTORE_FILE=$RUNNER_TEMP/loupe-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release keystore secret; the APKs are unsigned."
          fi
      - name: Version
        # app/pubspec.yaml's version with the run number: 0.2.0-nightly.123.
        # The version code stays the pubspec's, so a Nightly installs over the
        # release it follows and the next release installs over it.
        run: |
          version=$(sed -n 's/^version: //p' app/pubspec.yaml)
          echo "NAME=${version%%+*}-nightly.${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Build the Free APKs
        working-directory: app
        env:
          LOUPE_KEYSTORE_PASSWORD: ${{ secrets.LOUPE_KEYSTORE_PASSWORD }}
          LOUPE_KEY_ALIAS: ${{ secrets.LOUPE_KEY_ALIAS }}
          LOUPE_KEY_PASSWORD: ${{ secrets.LOUPE_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-x64 \
            --build-name="$NAME"
          mkdir -p ../dist-free
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../dist-free/loupe-free-$NAME-arm64.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "../dist-free/loupe-free-$NAME-x86_64.apk"
      - uses: actions/upload-artifact@v5
        with:
          name: loupe-free-apk-${{ github.run_number }}
          path: dist-free/*.apk
          retention-days: 14
      - name: Switch to the NonFree release type
        run: tool/release_type.sh nonfree
      - name: Build the NonFree APKs
        working-directory: app
        env:
          LOUPE_KEYSTORE_PASSWORD: ${{ secrets.LOUPE_KEYSTORE_PASSWORD }}
          LOUPE_KEY_ALIAS: ${{ secrets.LOUPE_KEY_ALIAS }}
          LOUPE_KEY_PASSWORD: ${{ secrets.LOUPE_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-x64 \
            --build-name="$NAME"
          mkdir -p ../dist
          # The website links to the asset ending in -arm64.apk (site/*/worker).
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../dist/loupe-$NAME-arm64.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "../dist/loupe-$NAME-x86_64.apk"
      - uses: actions/upload-artifact@v5
        with:
          name: loupe-apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 14
      - name: Publish to the rolling "nightly" pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes: the newest section of CHANGELOG.md, then the build.
          notes="$RUNNER_TEMP/notes.md"
          {
            awk '/^## /{n++} n==1' CHANGELOG.md
            echo
            echo "Build ${{ github.run_number }} from ${GITHUB_SHA::7}, the NonFree release type (with Push; docs/releasing.md). Earlier changes: [CHANGELOG.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)"
          } > "$notes"
          git tag -f nightly && git push -f origin refs/tags/nightly
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --prerelease --title "Nightly" --notes-file "$notes"
          gh release edit nightly --prerelease --title "Nightly $NAME" --notes-file "$notes"
          for f in $(gh release view nightly --json assets --jq '.assets[].name'); do gh release delete-asset nightly "$f" --yes; done
          gh release upload nightly dist/*.apk --clobber
