name: iOS

# Compiles the iOS app without signing, to show it builds. Run by hand only
# (Actions › iOS › Run workflow): macOS minutes cost ten times as much as
# Linux ones on a private repository. docs/ios.md has the whole iOS story.
on:
  workflow_dispatch:
    inputs:
      dependency_manager:
        description: >-
          How the iOS plugins are built. Flutter 3.47 uses Swift Package Manager
          (every plugin here has a Package.swift); CocoaPods is the fallback.
        type: choice
        options: [swiftpm, cocoapods]
        default: swiftpm

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  build:
    name: Build (no signing)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The newest released Xcode on the runner: App Store Connect only
      # takes builds from Xcode 26 and the iOS 26 SDK or later.
      - name: Toolchain
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
          flutter --version
      - name: Use CocoaPods instead of Swift Package Manager
        if: inputs.dependency_manager == 'cocoapods'
        run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - name: Podfile (CocoaPods only)
        if: inputs.dependency_manager == 'cocoapods'
        working-directory: app
        run: |
          # Generates ios/Podfile from Flutter's template, whose platform
          # line is commented out; the minimum is iOS 15 (as in the project).
          flutter build ios --config-only --release --no-codesign
          sed -i '' "s/^# platform :ios, .*/platform :ios, '15.0'/" ios/Podfile
          grep -n "^platform :ios" ios/Podfile
      # Resolves the plugins (Swift packages, or `pod install` with
      # CocoaPods), builds the native assets (SQLite3MultipleCiphers) and
      # compiles Runner.app for devices.
      - name: Build Runner.app
        working-directory: app
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }} \
            --build-name=0.1.${{ github.run_number }}
      - name: Check the bundle
        working-directory: app/build/ios/iphoneos/Runner.app
        run: |
          for key in CFBundleIdentifier CFBundleDisplayName MinimumOSVersion; do
            echo "$key: $(plutil -extract "$key" raw Info.plist)"
          done
          plutil -extract BGTaskSchedulerPermittedIdentifiers json -o - Info.plist; echo
          plutil -extract UIBackgroundModes json -o - Info.plist; echo
          test -f PrivacyInfo.xcprivacy
          ls Frameworks
      - name: Zip Runner.app
        working-directory: app/build/ios/iphoneos
        run: ditto -c -k --sequesterRsrc --keepParent Runner.app "$GITHUB_WORKSPACE/loupe-ios-0.1.${{ github.run_number }}-unsigned.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: loupe-ios-${{ github.run_number }}-unsigned
          path: loupe-ios-*-unsigned.zip
          retention-days: 14

