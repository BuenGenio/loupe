# Numbered releases (docs/releasing.md). Pushing a tag v<version> builds both
# release types from that commit, signed with the release key, and publishes
# them as a GitHub release; the NonFree app bundle goes to Google Play once
# the PLAY_SERVICE_ACCOUNT_JSON secret exists (docs/play-store.md).
#
# F-Droid builds the Free APKs again from the same tag, and ships the ones
# here, with our signature, when its build is identical (reproducible
# builds). So this job builds as F-Droid's recipe does
# (docs/fdroid/io.github.buengenio.loupe.yml): Flutter from the .flutter
# submodule, the pub cache inside the checkout, JDK 17, and the checkout at
# /home/runner/work/loupe/loupe, the path the recipe moves its copy to.

name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole Flutter history, so that Flutter knows its version.
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Version
        run: |
          [ "$GITHUB_WORKSPACE" = /home/runner/work/loupe/loupe ] || { echo "::error::F-Droid's recipe expects the checkout at /home/runner/work/loupe/loupe, not $GITHUB_WORKSPACE"; exit 1; }
          version=$(sed -n 's/^version: //p' app/pubspec.yaml)
          name=${version%%+*}
          code=${version##*+}
          [ "v$name" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME, but app/pubspec.yaml says $name (tool/release_prepare.sh)"; exit 1; }
          for c in $((code * 10 + 1)) $((code * 10 + 2)) $((code * 10 + 4)); do
            [ -s "fastlane/metadata/android/en-US/changelogs/$c.txt" ] || { echo "::error::No release notes for version code $c (tool/release_prepare.sh)"; exit 1; }
          done
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "CODE=$code" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.flutter/bin" >> "$GITHUB_PATH"
      - name: The tagged tree is the Free release type
        run: tool/ci/check_free.sh
      - name: Flutter
        run: |
          flutter config --no-analytics
          flutter --version
          flutter pub get --enforce-lockfile
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LOUPE_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Releases must be signed: no LOUPE_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/loupe-release.jks"
          echo "LOUPE_KEYSTORE_FILE=$RUNNER_TEMP/loupe-release.jks" >> "$GITHUB_ENV"
      - name: Free APKs
        working-directory: app
        env:
          LOUPE_KEYSTORE_PASSWORD: ${{ secrets.LOUPE_KEYSTORE_PASSWORD }}
          LOUPE_KEY_ALIAS: ${{ secrets.LOUPE_KEY_ALIAS }}
          LOUPE_KEY_PASSWORD: ${{ secrets.LOUPE_KEY_PASSWORD }}
        run: |
          mkdir -p ../dist
          # One build per APK, as F-Droid's recipe builds them.
          for abi in armeabi-v7a:android-arm arm64-v8a:android-arm64 x86_64:android-x64; do
            flutter build apk --release --split-per-abi --target-platform "${abi#*:}"
            cp "build/app/outputs/flutter-apk/app-${abi%%:*}-release.apk" "../dist/loupe-free-$NAME-${abi%%:*}.apk"
          done
      - name: Switch to the NonFree release type
        run: tool/release_type.sh nonfree
      - name: NonFree APKs and app bundle
        working-directory: app
        env:
          LOUPE_KEYSTORE_PASSWORD: ${{ secrets.LOUPE_KEYSTORE_PASSWORD }}
          LOUPE_KEY_ALIAS: ${{ secrets.LOUPE_KEY_ALIAS }}
          LOUPE_KEY_PASSWORD: ${{ secrets.LOUPE_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../dist/loupe-nonfree-$NAME-$abi.apk"
          done
          flutter build appbundle --release
          mkdir -p ../dist-play
          cp build/app/outputs/bundle/release/app-release.aab "../dist-play/loupe-nonfree-$NAME.aab"
      - name: Checksums
        run: (cd dist && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v5
        with:
          name: loupe-${{ env.NAME }}
          path: |
            dist/
            dist-play/
          retention-days: 90
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            cat "fastlane/metadata/android/en-US/changelogs/$((CODE * 10 + 2)).txt"
            echo
            echo "**Two release types** ([docs/releasing.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/releasing.md)):"
            echo
            echo "- **Free** (\`loupe-free-…\`): no Google code at all. The one F-Droid ships."
            echo "- **NonFree** (\`loupe-nonfree-…\`): adds Push through Google's push service (Firebase Cloud Messaging), which needs Google Play services."
            echo
            echo "Phones: \`arm64-v8a\`. Older 32-bit phones: \`armeabi-v7a\`. Emulators and Chromebooks: \`x86_64\`. Both types are signed with the same key and install over each other and over the Nightly."
            echo
            echo "All changes: [CHANGELOG.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)"
          } > "$notes"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Loupe $NAME" --notes-file "$notes" dist/*.apk dist/SHA256SUMS
      # New apps only accept draft releases until the first one is published:
      # set the repository variable PLAY_RELEASE_STATUS to "completed" after that.
      - name: Upload to Google Play (internal testing)
        if: env.HAS_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.buengenio.loupe
          releaseFiles: dist-play/*.aab
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
