# loupe.mx: builds the Astro site in site/ and deploys it to Cloudflare
# (Workers with static assets, see site/wrangler.jsonc).
#
# Secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"),
#          CLOUDFLARE_ACCOUNT_ID. Without them the site is built, not deployed.

name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/privacy-policy.md"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/privacy-policy.md"
      - ".github/workflows/site.yml"
  schedule:
    # Daily: publishes blog posts whose date has come and refreshes the
    # build-time numbers (tests, commits).
    - cron: "5 6 * * *"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git dates for "Updated" lines and the commit count
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::No CLOUDFLARE_API_TOKEN secret; built but not deployed."
            exit 0
          fi
          # Pasted secrets often carry a trailing newline or quotes, which break the Authorization header.
          clean() { printf %s "$1" | tr -d '[:space:]"'"'"; }
          export CLOUDFLARE_API_TOKEN="$(clean "$CLOUDFLARE_API_TOKEN")" CLOUDFLARE_ACCOUNT_ID="$(clean "$CLOUDFLARE_ACCOUNT_ID")"
          echo "token: ${#CLOUDFLARE_API_TOKEN} characters; account id: ${#CLOUDFLARE_ACCOUNT_ID} characters"
          npx wrangler deploy
          npx wrangler deploy --config worker-www/wrangler.jsonc
      - name: Zone settings (HTTPS only, TLS 1.2+)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -z "$CLOUDFLARE_API_TOKEN" ] && exit 0
          auth="Authorization: Bearer $(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]"'"'")"
          zone=$(curl -fsS "https://api.cloudflare.com/client/v4/zones?name=loupe.mx" -H "$auth" | jq -r '.result[0].id')
          for setting in 'always_use_https:"on"' 'min_tls_version:"1.2"' 'automatic_https_rewrites:"on"'; do
            name=${setting%%:*}; value=${setting#*:}
            curl -fsS -X PATCH "https://api.cloudflare.com/client/v4/zones/$zone/settings/$name" \
              -H "$auth" -H 'Content-Type: application/json' --data "{\"value\":$value}" | jq -c '{name: .result.id, value: .result.value, success}'
          done
