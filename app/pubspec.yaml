name: loupe
description: "Loupe: a mail app, simple on the surface, powerful underneath."
publish_to: none
version: 0.1.0+1
resolution: workspace
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
dependencies:
  flutter:
    sdk: flutter
  mail_model: {path: ../packages/mail_model}
  expr_search: {path: ../packages/expr_search}
  readable: {path: ../packages/readable}
  mail_imap: {path: ../packages/mail_imap}
  mail_store: {path: ../packages/mail_store}
  mail_sync: {path: ../packages/mail_sync}
  mail_platform: {path: ../packages/mail_platform}
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  fluentui_system_icons: ^1.1.273
  package_info_plus: ^10.2.2
  # MIT; the number on the app icon (iOS, Samsung One UI and other Android launchers).
  app_badge_plus: ^1.3.5
  # MIT (Flutter Community); Android WorkManager jobs: the 15-minute background sync and wake-ups.
  workmanager: ^0.10.10
  # BSD-3-Clause; new-mail notifications with Archive, Mark as Read and Reply buttons.
  flutter_local_notifications: ^22.3.1
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/demo/
    - assets/icon/icon_rounded.png

# `dart run flutter_launcher_icons` regenerates the launcher icons from these
# sources (made by a small PIL script; see assets/icon/).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/icon_background.png
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  min_sdk_android: 21
