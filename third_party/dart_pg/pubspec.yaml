name: dart_pg
description: Dart PG (Dart Privacy Guard) - The OpenPGP implementation in Dart language. Vendored by Loupe with interoperability fixes; see CHANGELOG.md.
version: 2.1.0+loupe.2
repository: https://github.com/web-of-trust/dart-pg
publish_to: none

environment:
  sdk: ^3.4.4

dependencies:
  # Loupe: SHA-1 and SHA-2 by the Dart team's package, several times faster
  # than pointycastle's (Helper.hashDigest, GenericS2k).
  crypto: ^3.0.6
  pinenacl: ^0.6.0
  pointycastle: ^4.0.0
  sign_dart: ^1.0.0
