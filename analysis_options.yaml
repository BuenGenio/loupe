include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/build/**"
    # The NonFree release type's packages: their dependencies resolve only in
    # a NonFree checkout (tool/release_type.sh), whose build CI checks.
    - "nonfree/**"
    # F-Droid's copy of the Flutter SDK, a submodule (docs/releasing.md).
    - ".flutter/**"

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
    - avoid_print
    - unawaited_futures

formatter:
  page_width: 120
