name: mail_crypto
description: "End-to-end encryption for Loupe: OpenPGP (PGP/MIME, Autocrypt) and S/MIME."
publish_to: none
version: 0.1.0
resolution: workspace
environment:
  sdk: ^3.13.0
dependencies:
  # BSD-3-Clause, pure Dart (RFC 9580 / 4880), vendored with interop fixes
  # (third_party/dart_pg/CHANGELOG.md). The backend uses its src/ types.
  dart_pg: {path: ../../third_party/dart_pg}
  mail_model: {path: ../mail_model}
  # MIT (the Bouncy Castle port), pure Dart; already under dart_pg. S/MIME's
  # primitives: RSA, ECDSA, ECDH, AES (CBC, GCM, key wrap), 3DES, RC2, the
  # PKCS #12 and PBKDF2 key derivations. CMS, X.509 and PKCS #12 structures
  # are mail_crypto's own (lib/src/smime).
  pointycastle: ^4.0.0
dev_dependencies:
  # The real MIME composer the PGP/MIME composer wraps, in tests.
  mail_imap: {path: ../mail_imap}
  test: any
