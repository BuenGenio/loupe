Builds:
  - versionName: 0.2.0
    versionCode: 5001
    commit: v0.2.0
    submodules: true
    sudo:
      - mkdir -p /home/runner/work/loupe
      - chown -R vagrant /home/runner/work/loupe
    output: app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: https://github.com/BuenGenio/loupe/releases/download/v%v/loupe-free-%v-armeabi-v7a.apk
    rm:
      - app/ios
      - nonfree
      - site
      - marketing
    prebuild:
      - export repo=/home/runner/work/loupe/loupe
      - cd ..
      - mv io.github.buengenio.loupe $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo io.github.buengenio.loupe
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - export repo=/home/runner/work/loupe/loupe
      - cd ..
      - mv io.github.buengenio.loupe $repo
      - pushd $repo/app
      - export PUB_CACHE=$repo/.pub-cache
      - ../.flutter/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
      - popd
      - mv $repo io.github.buengenio.loupe
    ndk: 28.2.13676358

