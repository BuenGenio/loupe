name: loupe_workspace
description: Workspace root of the Loupe mail app.
publish_to: none
environment:
  sdk: ^3.13.0
workspace:
  - app
  - packages/mail_model
  - packages/expr_search
  - packages/readable
  - packages/mail_imap
  - packages/mail_store
  - packages/mail_sync
  - packages/mail_platform
dev_dependencies:
  flutter_lints: ^6.0.0

# Build hook options. package:sqlite3 bundles SQLite3MultipleCiphers (MIT) so
# mail_store can encrypt the database; it includes FTS5. Hook user-defines
# are only read from the workspace root.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
