name: loupe_workspace
description: Workspace root of the Loupe mail app.
publish_to: none
environment:
  sdk: ^3.13.0
workspace:
  - app
  - packages/mail_model
  - packages/expr_search
  - packages/readable
  - packages/mail_imap
  - packages/mail_jmap
  - packages/mail_store
  - packages/mail_sync
  - packages/mail_sieve
  - packages/mail_platform
  - packages/mail_crypto
dev_dependencies:
  flutter_lints: ^6.0.0

# connectivity_plus needs dbus 0.8; flutter_local_notifications 22's Linux
# side still pins ^0.7.8, though its code works unchanged with 0.8 (its
# 9.0.0-dev.2 only widens the range to <0.9.0). Drop this once
# flutter_local_notifications 23 is stable.
dependency_overrides:
  dbus: ^0.8.0

# Build hook options. package:sqlite3 bundles SQLite3MultipleCiphers (MIT) so
# mail_store can encrypt the database; it includes FTS5. Hook user-defines
# are only read from the workspace root.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
